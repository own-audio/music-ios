name: OwnAudioMusic
options:
  bundleIdPrefix: audio.own
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MusicLibrary:
    path: Packages/MusicLibrary
  OwnAudioKit:
    path: Packages/OwnAudioKit
  PlayerEngine:
    path: Packages/PlayerEngine
targets:
  OwnAudioMusic:
    type: application
    platform: iOS
    sources:
      - path: App/OwnAudioMusic
      - path: Shared
    info:
      path: App/OwnAudioMusic/Info.plist
      properties:
        CFBundleDisplayName: own.music
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [audio.own.musicplayer.refresh]
        NSSupportsLiveActivities: true
        # The widget's and the Live Activity's way in (ownmusic://resume, ownmusic://play/…).
        CFBundleURLTypes:
          - CFBundleURLName: audio.own.musicplayer
            CFBundleURLSchemes: [ownmusic]
        # Only standard HTTPS, which is exempt; saves answering the export question per build.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Home servers are usually plain http on the LAN or a Tailscale address; the server URL
        # is whatever the user types, so ATS can't be scoped to known domains.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connects to the music server on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: audio.own.musicplayer
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM here: this repo is public. Simulator builds don't need one; for a
        # device, pick your team in Xcode (it is not saved into project.yml).
    entitlements:
      path: App/OwnAudioMusic/OwnAudioMusic.entitlements
      properties:
        # Sign in with Apple for own.audio servers (AUTH__APPLE__CLIENT_IDS must list this app).
        com.apple.developer.applesignin: [Default]
        # CarPlay audio app (granted by Apple for audio.own.musicplayer, 2026-10-16).
        com.apple.developer.carplay-audio: true
        # Shared with the widget: its snapshot and the Live Activity's cover.
        com.apple.security.application-groups: [group.audio.own.musicplayer]
    dependencies:
      - target: OwnAudioMusicWidgets
      - package: MusicLibrary
      - package: OwnAudioKit
      - package: PlayerEngine
        product: MusicEngine
  OwnAudioMusicWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: own.music
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: audio.own.musicplayer.widgets
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Widgets/OwnAudioMusicWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.audio.own.musicplayer]
  OwnAudioMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OwnAudioMusic
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: OwnAudioMusic
schemes:
  OwnAudioMusic:
    build:
      targets:
        OwnAudioMusic: all
        OwnAudioMusicUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OwnAudioMusicUITests
    archive:
      config: Release
