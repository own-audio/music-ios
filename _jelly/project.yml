name: OwnAudioJelly
options:
  bundleIdPrefix: audio.own
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  JellyfinKit:
    path: Packages/JellyfinKit
  # Shared with own.audio for Subsonic. To work on it alongside the app, point this at a local
  # checkout instead: `path: ../player-engine`.
  PlayerEngine:
    url: https://github.com/own-audio/player-engine
    from: 0.1.0
targets:
  OwnAudioJelly:
    type: application
    platform: iOS
    sources:
      - path: App/OwnAudioJelly
    info:
      path: App/OwnAudioJelly/Info.plist
      properties:
        CFBundleDisplayName: own.jelly
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Only standard HTTPS, which is exempt; saves answering the export question per build.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Home servers are usually plain http on the LAN or a Tailscale address; the server URL
        # is whatever the user types, so ATS can't be scoped to known domains.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connects to the music server on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: audio.own.jelly
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM here: this repo is public. Simulator builds don't need one; for a
        # device, pick your team in Xcode (it is not saved into project.yml).
    dependencies:
      - package: JellyfinKit
      - package: PlayerEngine
        product: MusicEngine
  OwnAudioJellyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OwnAudioJelly
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: OwnAudioJelly
schemes:
  OwnAudioJelly:
    build:
      targets:
        OwnAudioJelly: all
        OwnAudioJellyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OwnAudioJellyUITests
    archive:
      config: Release
